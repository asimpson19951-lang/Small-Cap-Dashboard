<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <!-- Mean Reversion Radar — app icon (dark rounded square, radar sweep, green R) -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#161616"/>
  <rect x="6" y="6" width="500" height="500" rx="92" fill="none" stroke="#2a2a2a" stroke-width="6"/>
  <!-- radar rings -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#2c2c2c" stroke-width="8"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#2c2c2c" stroke-width="6"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#2c2c2c" stroke-width="5"/>
  <!-- sweep wedge -->
  <path d="M256 256 L256 80 A176 176 0 0 1 380.5 131.5 Z" fill="rgba(74,158,110,.30)"/>
  <line x1="256" y1="256" x2="380.5" y2="131.5" stroke="#4a9e6e" stroke-width="10" stroke-linecap="round"/>
  <!-- blips -->
  <circle cx="330" cy="318" r="14" fill="#4a9e6e"/>
  <circle cx="196" cy="180" r="9" fill="#4a9e6e" opacity=".55"/>
  <!-- R glyph -->
  <text x="256" y="298" font-family="'Segoe UI', system-ui, Roboto, Arial, sans-serif" font-size="150"
        font-weight="800" fill="#4ade80" text-anchor="middle">R</text>
</svg>
